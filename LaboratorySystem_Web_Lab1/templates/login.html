{% extends "base.html" %}
{% block content %}
<div class="card auth-card">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="POST">
        <label>Username</label>
        <input type="text" name="username" value="{{ locked_username if locked_username else '' }}" required>
        
        <label>Password</label>
        <input type="password" name="password" required>
        
        <button type="submit" class="btn btn-primary" {% if locked %}disabled{% endif %}>Login</button>
    </form>
    <div class="auth-links">
        <a href="{{ url_for('register') }}">Register</a> | 
        <a href="{{ url_for('reset_request') }}">Reset Password</a>
    </div>
</div>
{% endblock %}
